<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tire Storage CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="client-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
    <div class="relative top-20 mx-auto p-5 border w-1/2 shadow-lg rounded-md bg-white dark:bg-gray-800">
      <div>
        <div class="flex border-b border-gray-200 dark:border-gray-700">
          <button class="modal-tab-button px-4 py-2 text-sm font-medium text-blue-600 border-b-2 border-blue-600" data-tab="details">Детали</button>
          <button class="modal-tab-button px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="history">История</button>
          <button class="modal-tab-button px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700" data-tab="photos">Фото</button>
        </div>
        <div id="modal-content-details" class="modal-content mt-3 text-center">
          <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white" id="modal-client-name"></h3>
          <div class="mt-2 px-7 py-3">
            <p class="text-sm text-gray-500" id="modal-client-details"></p>
          </div>
        </div>
        <div id="modal-content-history" class="modal-content hidden mt-3 px-7 py-3">
          <p>История действий...</p>
        </div>
        <div id="modal-content-photos" class="modal-content hidden mt-3 px-7 py-3">
          <p>Галерея фотографий...</p>
        </div>
        <div class="items-center px-4 py-3 mt-4 flex space-x-2">
          <button id="print-contract" class="flex-1 px-4 py-2 bg-green-600 text-white text-base font-medium rounded-md shadow-sm hover:bg-green-700">
            Печать договора
          </button>
          <button id="close-modal" class="flex-1 px-4 py-2 bg-gray-500 text-white text-base font-medium rounded-md shadow-sm hover:bg-gray-600">
            Закрыть
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
